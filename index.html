<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Čatas</title>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; background: #f0f2f5; }
    #chatScreen { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 70%; padding: 10px; border-radius: 8px; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
    .message.my { align-self: flex-end; background: #dcf8c6; }
    .message.other { align-self: flex-start; }
    .sender { font-size: 0.75rem; color: #666; margin-bottom: 3px; font-weight: bold; }
    .body { font-size: 0.95rem; word-break: break-word; }
    #inputArea { display: flex; padding: 10px; background: #fff; border-top: 1px solid #ddd; }
    #inputArea input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; outline: none; }
    #inputArea button { margin-left: 10px; padding: 10px 20px; border: none; background: #0084ff; color: #fff; border-radius: 4px; cursor: pointer; }
  </style>
</head>
<body>

  <div id="chatScreen"></div>

  <div id="inputArea">
    <input type="text" id="messageInput" placeholder="Rašykite žinutę...">
    <button onclick="sendMessage()">Siųsti</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ufjjvcynafhiyiznrwir.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVmamp2Y3luYWZoaXlpem5yd2lyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDAzNjcwMjQsImV4cCI6MjA1NTk0MzAyNH0.tJ9Qe1D9qU5lTzW2k1Fh1_0m8Z2v3x4y5z6A7B8C9D0'; // Įrašytas tavo anon raktas
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const currentUser = 'Gedas';

    async function loadMessages() {
      const { data, error } = await supabaseClient
        .from('messages')
        .select('*')
        .order('id', { ascending: true });

      if (error) {
        console.error('Klaida kraunant:', error.message);
        return;
      }

      document.getElementById('chatScreen').innerHTML = '';
      if (data) {
        data.forEach(msg => appendMessage(msg));
      }
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';

      const { data, error } = await supabaseClient
        .from('messages')
        .insert([{ user_name: currentUser, text: text }])
        .select();

      if (error) {
        alert('Klaida siunčiant: ' + error.message);
      } else if (data && data.length > 0) {
        appendMessage(data[0]);
      }
    }

    function appendMessage(msg) {
      const chatScreen = document.getElementById('chatScreen');
      if (document.getElementById('msg-' + msg.id)) return;

      const div = document.createElement('div');
      div.id = 'msg-' + msg.id;
      div.className = 'message ' + (msg.user_name === currentUser ? 'my' : 'other');

      const sender = document.createElement('div');
      sender.className = 'sender';
      sender.textContent = msg.user_name;

      const body = document.createElement('div');
      body.className = 'body';
      body.textContent = msg.text;

      div.appendChild(sender);
      div.appendChild(body);
      chatScreen.appendChild(div);
      chatScreen.scrollTop = chatScreen.scrollHeight;
    }

    loadMessages();

    supabaseClient
      .channel('public:messages')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
        appendMessage(payload.new);
      })
      .subscribe();
  </script>
</body>
</html>
