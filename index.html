<!DOCTYPE html>
<html lang="lt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hjorten Chat</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f0f2f5; display: flex; justify-content: center; height: 100vh; }
    .app-container { width: 100%; max-width: 480px; background: #ffffff; display: flex; flex-direction: column; height: 100%; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    .header { background: #0084ff; color: white; padding: 15px; text-align: center; font-size: 1.2rem; font-weight: bold; }
    .login-screen { padding: 30px 20px; display: flex; flex-direction: column; gap: 15px; justify-content: center; height: 100%; }
    .login-screen input, .input-area input { padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-size: 1rem; width: 100%; }
    .login-screen button, .input-area button { padding: 12px; background: #0084ff; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; }
    .chat-screen { display: none; flex-direction: column; height: 100%; }
    .messages-list { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; word-break: break-word; }
    .message.my { background: #0084ff; color: white; align-self: flex-end; border-bottom-right-radius: 2px; }
    .message.other { background: #e4e6eb; color: #050505; align-self: flex-start; border-bottom-left-radius: 2px; }
    .message .author { font-size: 0.75rem; opacity: 0.8; margin-bottom: 2px; font-weight: bold; }
    .input-area { padding: 10px; display: flex; gap: 8px; background: #fff; border-top: 1px solid #eee; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">Hjorten Chat</div>

    <!-- Prisijungimo langas -->
    <div id="loginScreen" class="login-screen">
      <h3>Sveiki! Įveskite savo vardą:</h3>
      <input type="text" id="userNameInput" placeholder="Tavo vardas (pvz. Gedas)">
      <button onclick="startChat()">Prisijungti</button>
    </div>

    <!-- Pokalbių langas -->
    <div id="chatScreen" class="chat-screen">
      <div id="messagesList" class="messages-list"></div>
      <div class="input-area">
        <input type="text" id="messageInput" placeholder="Rašykite žinutę..." onkeypress="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">Siųsti</button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://ufjjvcynafhyliznrwir.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_O5-F88q6Ygah-f6YPCthGw_LfvdA6yZ';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUser = '';

    async function startChat() {
      const input = document.getElementById('userNameInput');
      if (!input.value.trim()) return alert('Prašome įvesti vardą');
      currentUser = input.value.trim();
      
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('chatScreen').style.display = 'flex';
      
      loadMessages();
      subscribeToMessages();
    }

    async function loadMessages() {
      const { data, error } = await supabase.from('messages').select('*').order('id', { ascending: true });
      if (data) {
        document.getElementById('messagesList').innerHTML = '';
        data.forEach(msg => renderMessage(msg));
        scrollToBottom();
      }
    }

    async function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      await supabase.from('messages').insert([{ user_name: currentUser, text: text }]);
    }

    function renderMessage(msg) {
      const list = document.getElementById('messagesList');
      const div = document.createElement('div');
      const isMy = msg.user_name === currentUser;
      
      div.className = `message ${isMy ? 'my' : 'other'}`;
      div.innerHTML = `<div class="author">${isMy ? 'Aš' : msg.user_name}</div>${msg.text}`;
      
      list.appendChild(div);
      scrollToBottom();
    }

    function subscribeToMessages() {
      supabase.channel('public:messages')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, payload => {
          renderMessage(payload.new);
        })
        .subscribe();
    }

    function scrollToBottom() {
      const list = document.getElementById('messagesList');
      list.scrollTop = list.scrollHeight;
    }
  </script>
</body>
</html>
